name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest matplotlib
      - name: Unit tests (includes live scorer == batch scorer)
        run: python -m pytest -q
      - name: End-to-end experiment
        run: python -m iotsoc run --out ci-output
      - name: Shell and XML checks
        run: |
          bash -n wazuh/install.sh
          bash -n wazuh/uninstall.sh
          bash -n wazuh/test_rules.sh
          bash -n wazuh/bootstrap.sh
          bash -n wazuh/walkthrough.sh
          python -c "import xml.etree.ElementTree as ET; ET.parse('wazuh/rules/iotsoc_rules.xml')"
